<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/rv/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RateVault is an offline-enabled currency converter for saved exchange rates and quick multi-currency comparisons.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#02424D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RateVault">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RateVault</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    html, body { margin: 0; background: #F5F8F8; color: #02424D; font-family: system-ui, sans-serif; }
    #startup { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; padding: 24px; text-align: center; background: #F5F8F8; }
    #startup h1 { margin: 0 0 16px; }
    #startup p { max-width: 32rem; line-height: 1.5; }
    #startup .spinner { width: 32px; height: 32px; margin: 0 auto 12px; border: 3px solid #CCD9DA; border-top-color: #02424D; border-radius: 50%; animation: spin 1s linear infinite; }
    #startup[data-state="error"] .spinner { display: none; }
    #startup button { min-height: 48px; padding: 10px 24px; color: white; background: #02424D; border: 0; border-radius: 8px; font: inherit; cursor: pointer; }
    #startup button:focus-visible { outline: 3px solid #F47842; outline-offset: 4px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #startup .spinner { animation: none; } }
    @media (prefers-color-scheme: dark) { html, body, #startup { background: #0E1314; color: #67D5D0; } }
  </style>
  <section id="startup" aria-label="Starting RateVault">
    <h1>RateVault</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p id="startup-message" role="status" aria-live="polite">Getting your converter ready…</p>
    <button id="startup-retry" hidden>Try again</button>
    <noscript>Enable JavaScript to use RateVault.</noscript>
  </section>
  <script src="startup.js"></script>
  <script src="offline.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
